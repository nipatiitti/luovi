name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm banned-characters
      - run: pnpm format:check
      - run: pnpm boundaries
      - run: pnpm unused

  # The quick tier in Node and in the three browser engines. One OS is enough: the engines are compared with each
  # other inside the run, and Playwright's Linux builds carry the same JavaScript engines as the macOS ones.
  validate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @luovi/tool-validate exec playwright install --with-deps chromium webkit firefox
      - run: pnpm validate --engines
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-report
          path: packages/tool-validate/report.json
          if-no-files-found: ignore
